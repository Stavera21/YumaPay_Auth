openapi: 3.0.3
info:
  title: Escudo Yuma - Motor Antifraude en Tiempo Real
  description: |
    API de scoring y autorización preventiva de transacciones para Yuma Pay S.A. (SEDPE).
    Califica el riesgo en menos de 300 ms (P99 245 ms) combinando reglas dinámicas versionadas,
    modelo de machine learning y señales de comportamiento/grafo de red.
  version: 1.0.0
  contact:
    name: John Mazo (CISO) / Equipo Escudo Yuma
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor Local Sandbox Escudo Yuma

paths:
  /score:
    post:
      summary: Calificar riesgo de transacción en tiempo real (pre-autorización)
      description: |
        Endpoint crítico síncrono. Devuelve una de las cuatro decisiones (APROBAR, DESAFIAR,
        RETENER, RECHAZAR) con puntaje 0-1000, códigos de razón, desglose SHAP y latencia por etapa.
      operationId: scoreTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPayload'
      responses:
        '200':
          description: Evaluación de riesgo exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
        '400':
          description: Datos de transacción inválidos o incompletos

  /cases:
    get:
      summary: Obtener cola de alertas priorizadas para analistas SOC
      operationId: getCases
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDIENTE, EN_REVISION, CONFIRMADO_FRAUDE, DESCARTADO]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Lista de casos ordenados por riesgo y monto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseItem'

  /cases/{caseId}/resolve:
    post:
      summary: Cerrar caso de analista (bucle de retroalimentación)
      operationId: resolveCase
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, analistaId]
              properties:
                decision:
                  type: string
                  enum: [CONFIRMAR_FRAUDE, DESCARTAR_FALSO_POSITIVO, BLOQUEO_DEFINITIVO, SOLICITAR_VERIFICACION]
                analistaId:
                  type: string
                notas:
                  type: string
      responses:
        '200':
          description: Caso resuelto y retroalimentado al motor de reglas y aprendizaje

  /rules:
    get:
      summary: Catálogo de reglas dinámicas y precisión en vivo
      operationId: getRules
      responses:
        '200':
          description: Catálogo activo de reglas versionadas
    put:
      summary: Ajustar pesos o umbrales de reglas en caliente
      operationId: updateRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpdate'
      responses:
        '200':
          description: Regla actualizada sin despliegue de código

  /metrics:
    get:
      summary: Indicadores operativos, reducción de falsos positivos y ahorro acumulado
      operationId: getMetrics
      responses:
        '200':
          description: Métricas en tiempo real

  /fairness:
    get:
      summary: Auditoría de no discriminación y análisis de proxies (Fairlearn)
      operationId: getFairnessMetrics
      responses:
        '200':
          description: Métricas de paridad demográfica y ausencia de sesgo protegido

components:
  schemas:
    TransactionPayload:
      type: object
      required:
        - transaccion_id
        - cuenta_origen
        - cuenta_destino
        - monto
        - tipo_operacion
        - canal
      properties:
        transaccion_id:
          type: string
          example: "TX-202611-9874"
        cuenta_origen:
          type: string
          example: "CTA-782190"
        cuenta_destino:
          type: string
          example: "CTA-449102"
        monto:
          type: number
          example: 850000.0
        tipo_operacion:
          type: string
          enum: [TRANSFERENCIA_INMEDIATA, PAGO_QR, RETIRO_CORRESPONSAL, RECARGA, PAGO_SERVICIOS]
          example: "TRANSFERENCIA_INMEDIATA"
        canal:
          type: string
          enum: [APP_MOVIL, CORRESPONSAL, CAJERO, WEB]
          example: "APP_MOVIL"
        dispositivo_id:
          type: string
          example: "DEV-F89A-001"
        dispositivo_nuevo:
          type: boolean
          example: true
        cambio_clave_24h:
          type: boolean
          example: true
        cambio_sim_48h:
          type: boolean
          example: false
        time_to_cash_minutos:
          type: number
          example: 4.5
        monto_p95_90d:
          type: number
          example: 180000.0
        saldo_actual:
          type: number
          example: 890000.0
        es_madrugada:
          type: boolean
          example: false

    ScoreResponse:
      type: object
      properties:
        transaccion_id:
          type: string
        score_riesgo:
          type: integer
          minimum: 0
          maximum: 1000
          example: 685
        tramo_riesgo:
          type: string
          enum: [BAJO, MEDIO, ALTO, CRITICO]
          example: "ALTO"
        decision:
          type: string
          enum: [APROBAR, DESAFIAR, RETENER, RECHAZAR]
          example: "RETENER"
        mensaje_cliente:
          type: string
          example: "Por favor espere un momento mientras validamos su transacción por seguridad."
        explicacion:
          type: object
          properties:
            codigos_razon:
              type: array
              items:
                type: object
                properties:
                  codigo:
                    type: string
                    example: "RAZ-DEV-01"
                  descripcion:
                    type: string
                    example: "Dispositivo nuevo y transferencia en tiempo record"
            top_variables_shap:
              type: array
              items:
                type: object
                properties:
                  variable:
                    type: string
                  contribucion:
                    type: number
                  valor:
                    type: string
        desglose_capas:
          type: object
          properties:
            score_reglas_dinamicas:
              type: number
            score_ml_xgboost:
              type: number
            score_grafo_red:
              type: number
        presupuesto_latencia_ms:
          type: object
          properties:
            ingreso_autenticacion:
              type: number
            cache_contexto:
              type: number
            calculo_variables:
              type: number
            evaluacion_reglas:
              type: number
            inferencia_ml:
              type: number
            lookup_grafo_materializado:
              type: number
            orquestacion_politica:
              type: number
            generacion_explicacion:
              type: number
            traza_auditoria:
              type: number
            latencia_total_ms:
              type: number
              example: 48.2
            cumple_sla_300ms:
              type: boolean
              example: true

    CaseItem:
      type: object
      properties:
        caso_id:
          type: string
        transaccion_id:
          type: string
        fecha_hora:
          type: string
        score_riesgo:
          type: integer
        tramo_riesgo:
          type: string
        decision_motor:
          type: string
        monto:
          type: number
        cuenta_origen:
          type: string
        cuenta_destino:
          type: string
        modalidad_sospechosa:
          type: string
        estado:
          type: string
        tiempo_restante_sla_seg:
          type: integer

    RuleUpdate:
      type: object
      properties:
        codigo_regla:
          type: string
        peso:
          type: number
        activo:
          type: boolean
        umbral:
          type: number
